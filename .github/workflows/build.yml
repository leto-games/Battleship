name: Multi-Platform Build (STM32 & Windows)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-pack:
    strategy:
      matrix:
        include:
          - preset: "stm32f411xe-debug"
            os: ubuntu-latest
          - preset: "win-debug"
            os: windows-latest
          - preset: "win-release"
            os: windows-latest
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up ARM GCC (Linux)
      if: runner.os == 'Linux'
      uses: carlosperate/arm-none-eabi-gcc-action@v1
      with:
        # Pinned instead of 'latest': ARM re-uploaded the 15.3.Rel2 tarball
        # with different contents, so the action's recorded sha256 for it
        # no longer matches and downloads fail checksum verification.
        # https://github.com/carlosperate/arm-none-eabi-gcc-action/issues/111
        release: '15.3.Rel1'

    - name: Set up MSVC Developer Command Prompt (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: cmake --preset ${{ matrix.preset }}

    - name: Build Firmware
      run: cmake --build --preset ${{ matrix.preset }} --parallel

    - name: Install and Organize SDK
      run: cmake --install build/${{ matrix.preset }} --prefix dist/${{ matrix.preset }} --component app

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.repository.name }}-${{ matrix.preset }}
        path: dist/${{ matrix.preset }}/
        if-no-files-found: error
